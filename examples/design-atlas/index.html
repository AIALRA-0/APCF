/* AIALRA_INCREMENT v0.5-r2 CSS */
/* r2 scoped refinements. Frozen Design v0.1 and the r1 source remain intact.
   13 = related controls; 21 = content blocks; 34 = sections. Geometry, not ratios alone, decides fit. */
:root{--r2-related:13px;--r2-block:21px;--r2-section:34px}
/* Component examples retain one complete row. Nested content gets its own spacing contract. */
#atlas-root .case-row{margin:0;overflow:visible}
#atlas-root .case-row>header{padding:var(--r2-block) var(--r2-section);gap:var(--r2-block)}
#atlas-root .case-stage{padding:var(--r2-section);gap:var(--r2-block)}
#atlas-root .case-work{gap:var(--r2-block);min-width:0}
#atlas-root .case-work>.st-row{gap:var(--r2-related);row-gap:var(--r2-related)}
#atlas-root .case-panel{gap:var(--r2-block);padding:var(--r2-block)}
#atlas-root .case-panel>h4,#atlas-root .case-panel>p{margin:0}
#atlas-root .case-three{gap:var(--r2-block);grid-template-columns:repeat(auto-fit,minmax(min(100%,155px),1fr))}
#atlas-root .case-list{gap:var(--r2-block)}
#atlas-root .case-list>li{column-gap:var(--r2-block);row-gap:var(--r2-related);padding:16px 21px;flex-wrap:wrap}
#atlas-root .case-list>li>span:not(.st-pill){flex:1 1 160px}
#atlas-root .case-list small{margin-top:8px;line-height:1.65}
#atlas-root .case-dl{row-gap:var(--r2-related);column-gap:var(--r2-block);align-items:start}
#atlas-root .case-chart{padding:var(--r2-block)}
#atlas-root .case-chart+.st-row,#atlas-root .case-progress+.st-row{margin:0}
#atlas-root .case-result:not(:empty){padding-top:var(--r2-related);border-top:1px solid var(--line);line-height:1.75;overflow-wrap:anywhere}
#atlas-root .case-limits{margin:0 var(--r2-section) var(--r2-section)}
#atlas-root .case-table-wrap :is(td,th){line-height:1.65}
#atlas-root .case-stage .case-progress>.st-row{gap:var(--r2-related)}
#atlas-root .case-steps+.case-panel{margin-top:0}
/* Heading-copy proximity is intentional; independent content blocks must not share a zero gap. */
#atlas-root .case-panel :is(.case-list,.case-dl){margin:0}
#atlas-root .case-step-list li span{margin-top:var(--r2-related)}
#atlas-root .case-step-list{gap:var(--r2-block)}
/* Native composite internals (tabs, split buttons, grids, charts, graph ports) keep their own geometry. */
@container atlas-view (max-width:640px){
 #atlas-root .case-stage{padding:var(--r2-block)}
 #atlas-root .case-row>header{padding:var(--r2-block)}
 #atlas-root .case-limits{margin:0 var(--r2-block) var(--r2-block)}
 #atlas-root .case-two{grid-template-columns:minmax(0,1fr)}
 #atlas-root .case-panel{padding:16px}
 #atlas-root .case-list>li{padding:16px}
}
@container atlas-view (max-width:400px){
 #atlas-root .case-stage{padding:16px}
 #atlas-root .case-row>header{padding:16px}
 #atlas-root .case-row>header{flex-wrap:wrap}
 #atlas-root .case-three{grid-template-columns:minmax(0,1fr)}
 #atlas-root .case-limits{margin:0 16px 21px}
}

R.add('media',13,['拖放目标只接受文件，并显示文件信息；普通文字拖入不会冒充文件。','A drop target accepts files and reports their details, not arbitrary dragged text.'],c=>`<div class="case-dropzone" data-drop-target><strong>${c.t('拖入一个文件','Drop one file')}</strong><p>${c.t('仅本地读取名称和大小','Read filename and size locally only')}</p></div>`,null,{mount:c=>{const d=c.$('[data-drop-target]');d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];c.out(f?f.name+' · '+f.size+' B':'No file in drop payload',!f)}}});
R.add('media',14,['附件列表能导出匹配格式的内容，并能移除指定附件。','Attachments export matching native content and can remove a specific attachment.'],c=>list((c.s.files||['guide.md','schema.json']).map((f,i)=>`${U.svg('file')}<span>${f}</span>${I('download','Export '+f,'export',`data-value="${f}"`)}${I('close','Remove '+f,'remove',`data-value="${f}"`)}`)),c=>{if(c.op==='export'){U.download(c.value,c.value.endsWith('.json')?'{"schema":1,"name":"sample"}':'# Sample guide\n\nLocal attachment.',c.value.endsWith('.json')?'application/json':'text/markdown');c.out('Exported '+c.value)}if(c.op==='remove'){c.s.files=(c.s.files||['guide.md','schema.json']).filter(x=>x!==c.value);c.redraw();c.out('Removed '+c.value)}});
R.add('media',15,['文件版本展示实际大小和内容，选中版本可另存为独立文件。','File versions show actual content and size and can export the selected revision separately.'],c=>U.select('File revision','revision',c.s.revision||'r2',[['r1','r1'],['r2','r2']])+code(c.s.revision==='r1'?'timeout = 20':'timeout = 30\nretries = 2')+B('Export selected revision','export'),c=>{if(c.op==='select')c.redraw();if(c.op==='export'){const text=c.s.revision==='r1'?'timeout = 20':'timeout = 30\nretries = 2';U.download('settings-'+(c.s.revision||'r2')+'.toml',text,'application/toml');c.out(new TextEncoder().encode(text).length+' bytes exported')}});
R.add('media',16,['导出选项决定文件格式与列头，产物和选项相匹配。','Export options determine the format and headers, and the produced file matches them.'],c=>U.select('Format','format',c.s.format||'json',[['json','JSON'],['csv','CSV']])+check('Include column headers (CSV)','headers',c.s.headers!==false)+B('Export sample data','export','primary'),c=>{if(c.op==='export'){const f=c.s.format||'json',text=f==='json'?JSON.stringify([{name:'Atlas',cases:289}],null,2):(c.s.headers===false?'':'name,cases\r\n')+'Atlas,289';U.download('atlas-sample.'+f,text,f==='json'?'application/json':'text/csv');c.out('atlas-sample.'+f)}});

R.add('collab',1,['账户入口显示模拟身份，菜单操作不会退出真实账户。','An account menu shows a simulated identity and never signs out a real account.'],c=>row(avatar('Demo User'),`<span>Demo User · local fixture</span>`,I('more','Account menu','menu')),c=>{if(c.op==='menu')U.menu(c.button,[{label:'Profile preview',icon:'file'},{label:'Workspace preferences',icon:'sliders'},{label:'End local session preview',icon:'close'}],it=>c.out(it.label+' · local only'))});
R.add('collab',2,['登录表单只校验样例字段，不认证、不发送、不存储真实密码。','A sign-in form validates fixture fields without authentication, transmission or real password storage.'],c=>F('Sample email','email',c.s.email||'demo@example.com','email')+F('Synthetic password only','password','','password','autocomplete="off"')+B('Validate form only','validate','primary')+`<p class="st-note">${c.t('不要填写真实凭据。这是表单设计样例。','Do not enter real credentials. This is a form-design specimen.')}</p>`,c=>{if(c.op==='validate'){const ok=c.$('input[type=email]').checkValidity()&&(c.s.password||'').length>=6;c.out(ok?'Form valid · no authentication performed':'Use a valid email and at least 6 sample characters',!ok);c.s.password='';c.$('input[type=password]').value=''}});
R.add('collab',3,['MFA 样例验证六位输入格式；固定样例码不是安全认证。','An MFA specimen validates six digits; its fixed demo code is not authentication.'],c=>F('Demo verification code','code',c.s.code||'','text','inputmode="numeric" maxlength="6" pattern="[0-9]{6}"')+B('Check demo code','check')+`<p class="st-note">${c.t('固定样例码：123456；不用于任何真实账户。','Fixed demo code: 123456. Not tied to any real account.')}</p>`,c=>{if(c.op==='check')c.out(c.s.code==='123456'?'Demo code matched · not authenticated':'Demo code does not match',c.s.code!=='123456')});
R.add('collab',4,['邀请表单显示接收人和角色，提交仅添加本地预览条目。','An invitation form shows recipient and role and adds only a local preview entry.'],c=>F('Recipient email','email',c.s.email||'reviewer@example.com','email')+U.select('Role','role',c.s.role||'Viewer',[['Viewer','Viewer'],['Editor','Editor']])+B('Preview invitation','invite')+`<div data-invite-result></div>`,c=>{if(c.op==='invite'){if(!c.$('input').checkValidity())return c.out('Invalid email',true);c.$('[data-invite-result]').innerHTML=panel(E(c.s.email)+' · '+E(c.s.role||'Viewer')+'<br>Invitation preview only — no email sent');c.out('Local preview created')}});
R.add('collab',5,['在线状态使用文字与状态点，且明确这是模拟存在感。','Presence combines text and status dots and is explicitly simulated.'],c=>U.select('Preview availability','presence',c.s.presence||'Available',[['Available','Available'],['Busy','Busy'],['Away','Away']])+row(avatar('Demo User'),badge('● '+(c.s.presence||'Available')),`<small>Simulated presence</small>`),c=>{if(c.op==='select'){c.redraw();c.out(c.value+' · simulated')}});
R.add('collab',6,['头像组折叠超额成员，点击数量能看到完整名单。','An avatar group collapses overflow members and reveals the full roster through its count.'],c=>row(avatar('Alex'),avatar('Taylor'),avatar('Morgan'),B('+2','roster')),c=>{if(c.op==='roster')U.popover(c.button,'Demo participants',list(['Alex · Designer','Taylor · Engineer','Morgan · Reviewer','Casey · Analyst','Sam · Observer'].map(E)))});
R.add('collab',7,['提及提醒说明谁提及了什么内容，并提供定位入口。','A mention notice explains who mentioned what and offers a location action.'],c=>`<div class="case-alert"><div><strong>Demo reviewer mentioned @you</strong><p>“Please check the keyboard path in Select.”</p></div>${B(c.t('查看线程','View thread'),'thread')}</div>`,c=>{if(c.op==='thread')U.dialog('Select review thread',panel('<strong>Demo reviewer</strong><p>Please check the keyboard path in Select.</p>')+F('Local reply draft','reply','@Demo reviewer '))});
R.add('collab',8,['评论可新增和删除自己的本地条目，不影响其他人的示例内容。','Comments can add or remove your local entries without changing fixture comments by others.'],c=>list(['<span><strong>Demo reviewer</strong><small>Please keep the visual hierarchy clear.</small></span>',...(c.s.comments||[]).map((x,i)=>`<span><strong>You · local</strong><small>${E(x)}</small></span>${I('close','Remove comment','remove',`data-value="${i}"`)}`)])+F('Comment','comment',c.s.comment||'','textarea')+B('Add local comment','add'),c=>{if(c.op==='add'){if(!c.s.comment?.trim())return c.out('Empty comment',true);c.s.comments=[...(c.s.comments||[]),c.s.comment];c.s.comment='';c.redraw();c.out('Comment added locally')}if(c.op==='remove'){c.s.comments=(c.s.comments||[]).filter((x,i)=>i!==+c.value);c.redraw();c.out('Your comment removed')}});
R.add('collab',9,['批注关联到一个明确文本片段，弹层展示该片段与备注。','An annotation attaches to a specific text fragment and shows it alongside the note.'],c=>panel(`<p>Keep <button class="case-inline-annotation" data-case-op="annotation">keyboard focus visible</button> when icon borders are removed.</p>`),c=>{if(c.op==='annotation')U.popover(c.button,'Annotation on “keyboard focus visible”',F('Local annotation','note',c.s.note||'Do not remove :focus-visible styles.','textarea')+B('Save annotation','save'),p=>p.querySelector('[data-case-op]').onclick=()=>{c.s.note=p.querySelector('textarea').value;c.out(c.s.note);p.hidePopover()})});
R.add('collab',10,['冲突提示保留两份值并说明变更来源，不能静默覆盖。','A conflict notice retains both values and identifies their source instead of overwriting silently.'],c=>`<div class="case-alert warning"><div><strong>Another simulated editor changed the title</strong><p>Local: “Design review”<br>Remote fixture: “UI review”</p></div></div>`+row(B('Keep local','local'),B('Use remote fixture','remote')),c=>{if(c.op==='local'||c.op==='remote')c.out(c.op==='local'?'Resolved title: Design review':'Resolved title: UI review')});
R.add('collab',11,['角色管理逐人编辑并明确权限来源是本地模拟。','Role management edits each participant separately and is clearly a local simulation.'],c=>table(['Participant','Role'],['Demo A','Demo B','Demo C'].map((n,i)=>[n,U.select('Role of '+n,'role'+i,c.s['role'+i]||'Viewer',[['Viewer','Viewer'],['Editor','Editor'],['Admin','Admin']])])),c=>{if(c.op==='select')c.out(c.key+' → '+c.value+' · UI only, no real permission changed')});
R.add('collab',12,['分享范围与到期时间在二级设置中明确呈现，不自动创建公开链接。','Sharing scope and expiry are explicit and never create a public link automatically.'],c=>B('Configure sharing preview','sharing'),c=>{if(c.op==='sharing')U.dialog('Sharing preview',U.select('Scope','scope','Private',[['Private','Private'],['Team','Team only']])+F('Expiry','expiry','2026-10-15','date')+`<p>${c.t('仅预览；不会修改真实文件访问权限。','Preview only; real file access permissions are not changed.')}</p>`+B('Save preview settings','save','primary'),d=>d.querySelector('[data-case-op]').onclick=()=>{c.out('Sharing preview saved · no link published');d.close()})});
R.add('collab',13,['审核事件同时保留对象、操作者、前值和后值。','An audit event retains object, actor, previous value and new value.'],c=>`<dl class="case-dl"><dt>Object</dt><dd>sample-user-role</dd><dt>Actor</dt><dd>Local demo operator</dd><dt>Change</dt><dd>Viewer → Editor</dd><dt>Scope</dt><dd>Synthetic event only</dd></dl>`+details('View event payload',code('{"object":"sample-user-role","before":"Viewer","after":"Editor","synthetic":true}')),null,{level:'native-interaction'});
R.add('collab',14,['协作光标显示姓名和坐标；演示位置变化，不声称真实同步。','A collaborative cursor shows a label and coordinates; movement is simulated, not synchronized.'],c=>`<div class="case-collab-canvas"><span class="case-sim-cursor" data-cursor style="left:${c.s.x||20}%;top:40%">↖ Demo user · simulated</span></div>`+B('Move simulated cursor','move'),c=>{if(c.op==='move'){c.s.x=((c.s.x||20)+15)%70;c.$('[data-cursor]').style.left=c.s.x+'%';c.out('Simulated cursor: '+c.s.x+'%, 40%')}});
R.add('collab',15,['通知中心保留已读状态，再次打开仍显示准确计数和当前语言。','A notification center retains read state, accurate counts and the current UI language.'],c=>row(I('more',c.t('打开通知中心','Open notification center'),'notifications'),badge(c.t('未读 · ','Unread · ')+(3-(c.s.read||[]).length))),c=>{if(c.op==='notifications')U.popover(c.button,c.t('通知中心','Notification center'),list([['审核请求','Review request'],['画布中的提及','Mention in Canvas'],['导出提醒','Export reminder']].map(([zh,en],i)=>`<span>${c.t(zh,en)}<small>${(c.s.read||[]).includes(i)?c.t('已读','Read'):c.t('未读','Unread')}</small></span>${B(c.t('标记已读','Mark as read'),'read','',`data-value="${i}" ${(c.s.read||[]).includes(i)?'disabled':''}`)}`)),p=>p.querySelectorAll('[data-case-op]').forEach(b=>b.onclick=()=>{c.s.read=[...new Set([...(c.s.read||[]),+b.dataset.value])];b.disabled=true;b.closest('li').querySelector('small').textContent=c.t('已读','Read');c.out(c.t('已读 · ','Read · ')+c.s.read.length);c.$('.st-pill').textContent=c.t('未读 · ','Unread · ')+(3-c.s.read.length)}))});
})(globalThis);

(function(g){'use strict';const R=g.CaseRegistry,U=g.StudioUI,{E,field,button,icon,check,table,code,list,progress}=R;const add=R.add;
add('access',1,['用 Tab 检查真实焦点，而非画一圈假焦点','Use Tab to inspect actual keyboard focus, not a decorative ring'],c=>`<div class="st-row">${button(c.t('第一个控件','First control'),'first')}${button(c.t('第二个控件','Second control'),'second')}${icon('settings',c.t('配置此样例','Configure this case'),'settings')}</div><p>${c.t('用 Tab 在三个控件之间移动；仅当前聚焦控件显示焦点环。','Tab through three controls; only the currently focused control has a focus ring.')}</p>`,c=>{if(c.op==='settings')c.dialog(c.t('样例配置','Case settings'),'<p>Keyboard focus · native buttons</p>');else if(['first','second'].includes(c.op))c.out(c.t('已激活：','Activated: ')+c.button.textContent)}, {mount:c=>c.el.onfocusin=e=>{if(e.target.matches('button'))c.out(c.t('当前焦点：','Current focus: ')+(e.target.getAttribute('aria-label')||e.target.textContent))}});
add('access',2,['模态框里的焦点循环与关闭后的焦点返回','Modal focus cycling and return to the invoking control'],c=>`${button(c.t('打开焦点测试对话框','Open focus test dialog'),'open')}<p>${c.t('Tab / Shift+Tab 留在模态框中；Escape 关闭并返回打开按钮。','Tab / Shift+Tab stay inside the modal; Escape closes it and returns focus.')}</p>`,c=>{if(c.op==='open')c.dialog(c.t('键盘焦点测试','Keyboard focus test'),field(c.t('名称','Name'),'modalName','Focus trial')+'<div class="st-row"><button class="st-button" data-close>完成 / Done</button></div>',d=>d.querySelector('[data-close]').onclick=()=>d.close())});
add('access',3,['跳过重复导航，直接聚焦正文入口','Skip repeated navigation and focus the content entry'],c=>`<a class="case-skip-example" href="#${c.id}-content">${c.t('跳到正文','Skip to content')}</a><nav class="case-mini-nav" aria-label="${c.t('样例导航','Example navigation')}">${button(c.t('首页','Home'),'home')}${button(c.t('资源','Resources'),'resources')}</nav><section id="${c.id}-content" tabindex="-1" class="case-panel"><h4>${c.t('正文入口','Content entry')}</h4><p>${c.t('这个区域可以由跳过链接直接获得焦点。','The skip link moves focus directly to this content region.')}</p></section>`,c=>{if(['home','resources'].includes(c.op))c.out(c.op)}, {mount:c=>c.$('.case-skip-example').onclick=e=>{e.preventDefault();c.$(`#${c.id}-content`).focus();c.out(c.t('焦点已跳到正文。','Focus moved to content.'))}});
add('access',4,['计数变化通过 polite live region 播报','Announce count changes through a polite live region'],c=>`<div class="st-row">${button(c.t('加入队列','Add to queue'),'add')}${button(c.t('清空队列','Clear queue'),'clear')}</div><p role="status" aria-live="polite" aria-atomic="true">${c.t('队列中有','Queue contains')} <strong>${c.s.n||0}</strong> ${c.t('项','items')}</p>`,c=>{if(['add','clear'].includes(c.op)){c.s.n=c.op==='add'?(c.s.n||0)+1:0;c.$('[role="status"]').innerHTML=`${c.t('队列中有','Queue contains')} <strong>${c.s.n}</strong> ${c.t('项','items')}`;c.out(c.t('已更新计数；未移动焦点。','Count updated without moving focus.'))}});
add('access',5,['同样的无框图标，具有明确的可访问名称','Frameless icons with explicit accessible names'],c=>`<div class="st-row">${icon('search',c.t('搜索组件目录','Search component catalog'),'search')}${icon('download',c.t('导出当前样例说明','Export case notes'),'export')}${icon('help',c.t('查看键盘帮助','Open keyboard help'),'help')}</div>${code('button → aria-label → tooltip\nSVG → aria-hidden="true"')}`,c=>{if(c.op==='export')U.download('accessible-name.txt','Buttons in this case have explicit accessible names.');if(['search','help'].includes(c.op))c.dialog(c.t('功能说明','Action details'),`<p>${c.op==='search'?c.t('此按钮示范搜索入口的可访问名称。','This button demonstrates an accessible search action.'):c.t('Tab 聚焦；Enter 或 Space 激活；Escape 关闭。','Tab focuses; Enter or Space activates; Escape dismisses.')}</p>`);if(['search','help','export'].includes(c.op))c.out(c.button.getAttribute('aria-label'))});
add('access',6,['提高样例边界与文字对比，不改变用户数据','Increase specimen contrast without changing user data'],c=>`${check(c.t('高对比样例','High contrast specimen'),'high',!!c.s.high)}<div class="case-panel case-contrast ${c.s.high?'is-high':''}"><h4>${c.t('导入结果','Import result')}</h4><p>${c.t('已读取 6 行；其中 1 行需要复核。','Read 6 rows; 1 row needs review.')}</p><span class="st-pill">${c.t('需要复核','Review required')}</span></div>`,c=>{if(c.key==='high'&&c.op==='change')c.redraw()});
add('access',7,['放大文本至 200%，观察换行和控件高度','Resize text to 200% and inspect wrapping and control growth'],c=>`${field(c.t('文字缩放百分比','Text scale percent'),'scale',c.s.scale||100,'range','min="100" max="200" step="25"')}<output class="case-scale-value">${c.s.scale||100}%</output><div class="case-text-resize" style="font-size:${(+c.s.scale||100)/100}rem"><h4>${c.t('可读内容不被固定高度截断','Readable text is not clipped by fixed heights')}</h4><p>${c.t('按钮可以换行，长标题保持完整，说明文本仍在自己的区块中。','Buttons can wrap, long headings stay intact, and descriptions remain in their own region.')}</p><button class="st-button">${c.t('查看完整说明','Read the complete explanation')}</button></div>`,c=>{if(c.key==='scale'&&c.op==='input'){c.$('.case-text-resize').style.fontSize=(+c.value/100)+'rem';c.$('.case-scale-value').textContent=c.value+'%'}});
add('access',8,['减少动效时保留状态变化的文字结果','Preserve textual state changes when reduced motion is enabled'],c=>`${check(c.t('减少动效','Reduce motion'),'reduced',!!c.s.reduced)}<div class="case-motion-track ${c.s.reduced?'reduce':''}"><span style="transform:translateX(${c.s.moved?180:0}px)"></span></div>${button(c.t('切换位置','Toggle position'),'move')}<span class="st-status">${c.s.moved?c.t('终点','End'):c.t('起点','Start')}</span>`,c=>{if(c.op==='move'){c.s.moved=!c.s.moved;c.redraw()}if(c.key==='reduced'&&c.op==='change')c.redraw()});
add('access',9,['比较触控命中区，而不缩小图标本身','Compare touch hit areas without shrinking the icon'],c=>`<div class="case-two"><div class="case-panel"><h4>${c.t('紧凑工具栏：36 × 36','Compact toolbar: 36 × 36')}</h4>${icon('settings',c.t('紧凑设置入口','Compact settings control'),'compact','style="width:36px;height:36px;min-width:36px;min-height:36px"')}</div><div class="case-panel"><h4>${c.t('触控优先：44 × 44','Touch-first: 44 × 44')}</h4>${icon('settings',c.t('触控设置入口','Touch-first settings control'),'touch','style="width:44px;height:44px;min-width:44px;min-height:44px"')}</div></div><p>${c.t('数值是本样例的尺寸选择，不代表所有界面都必须使用同一尺寸。','These are specimen sizing choices, not a universal dimension for every interface.')}</p>`,c=>{if(['compact','touch'].includes(c.op))c.out(c.t('命中区域：','Activated hit area: ')+(c.op==='touch'?'44 × 44':'36 × 36'))});
add('access',10,['语义来自真实元素，不是截图外观','Semantics come from real elements, not a screenshot'],c=>`<section aria-labelledby="${c.id}-h"><h4 id="${c.id}-h">${c.t('组件信息','Component information')}</h4><dl class="case-dl"><dt>${c.t('名称','Name')}</dt><dd>Sidebar tabs</dd><dt>${c.t('版本','Version')}</dt><dd>v0.5-r1</dd></dl>${button(c.t('读取语义摘要','Read semantic summary'),'inspect')}</section>`,c=>{if(c.op==='inspect')c.out(c.t('section 由标题命名；属性使用 dt/dd；操作使用原生 button。','Section is named by its heading; properties use dt/dd; the action is a native button.'))},{level:'semantic'});
add('access',11,['工具栏方向键移动焦点，与 Tab 进入退出分离','Arrow keys move toolbar focus; Tab enters and leaves'],c=>`<div role="toolbar" aria-label="${c.t('对齐工具栏','Alignment toolbar')}" class="st-row case-roving">${['left','center','right'].map((v,i)=>`<button class="st-button" data-case-op="align" data-value="${v}" tabindex="${i===0?0:-1}" aria-pressed="${(c.s.align||'left')===v}">${c.t({left:'左对齐',center:'居中',right:'右对齐'}[v],v)}</button>`).join('')}</div><div class="case-panel" style="text-align:${c.s.align||'left'}">${c.t('对齐结果','Aligned content')}</div>`,c=>{if(c.op==='align'){c.s.align=c.value;c.$('.case-panel').style.textAlign=c.value;for(const b of c.$$('.case-roving button'))b.setAttribute('aria-pressed',b.dataset.value===c.value)}},{mount:c=>{const bar=c.$('.case-roving');bar.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const bs=[...bar.children],i=bs.indexOf(document.activeElement);let j=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length;bs.forEach((b,k)=>b.tabIndex=k===j?0:-1);bs[j].focus()}}});
add('access',12,['错误文字通过 aria-describedby 关联到原输入','Associate an error with its original input using aria-describedby'],c=>`${field(c.t('工作区邮箱','Workspace email'),'email',c.s.email||'','email',`aria-describedby="${c.id}-help ${c.id}-error"`)}<small id="${c.id}-help">${c.t('仅作本地校验，不发送邮件。','Local validation only; no email is sent.')}</small><p class="st-error" id="${c.id}-error" role="alert"></p>${button(c.t('验证','Validate'),'validate')}`,c=>{if(c.op==='validate'){const input=c.$('[data-field="email"]'),valid=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value);input.setAttribute('aria-invalid',String(!valid));c.$(`#${c.id}-error`).textContent=valid?'':c.t('请输入完整邮箱地址，例如 qa@example.com。','Enter a complete address, such as qa@example.com.');if(!valid)input.focus();else c.out(c.t('地址格式有效；没有发送邮件。','Address format is valid; no email sent.'))}});
add('access',13,['小屏导航按需打开，关闭后回到触发器','Open navigation on demand and return focus when closed'],c=>`<div class="case-phone-shell"><header>${icon('menu',c.t('打开移动导航','Open mobile navigation'),'open')}<strong>${c.t('资源中心','Resource center')}</strong></header><p>${E(c.s.page||c.t('概览','Overview'))}</p></div>`,c=>{if(c.op==='open'){const d=c.dialog(c.t('移动导航','Mobile navigation'),'<nav class="st-stack">'+['Overview','Library','Settings'].map(v=>`<button class="st-button" data-page="${v}">${v}</button>`).join('')+'</nav>',d=>d.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{c.s.page=b.dataset.page;c.$('.case-phone-shell p').textContent=c.s.page;d.close()}));d.classList.add('st-drawer')}});
add('access',14,['平板横竖屏使用真实重新排版，而不是缩小截图','Reflow tablet orientation instead of shrinking a screenshot'],c=>`${button(c.t('切换横竖布局','Toggle orientation'),'toggle')}<div class="case-tablet ${c.s.portrait?'portrait':''}"><aside>${c.t('项目列表','Project list')}</aside><main><h4>Design Atlas</h4><p>${c.t('横向双栏；竖向上下分区。内容顺序一致。','Two columns in landscape; stacked regions in portrait. Content order stays consistent.')}</p></main></div>`,c=>{if(c.op==='toggle'){c.s.portrait=!c.s.portrait;c.$('.case-tablet').classList.toggle('portrait',c.s.portrait)}});
add('access',15,['模拟离线回退保留最近缓存并明确时间','Simulated offline fallback retains a timestamped local fixture'],c=>`${check(c.t('模拟网络不可用','Simulate unavailable network'),'offline',!!c.s.offline)}<div class="case-panel"><h4>${c.s.offline?c.t('缓存快照','Cached snapshot'):c.t('本地样例数据','Local fixture')}</h4><p>Sidebar tabs · v0.5-r1</p><small>${c.s.offline?c.t('样例缓存时间：2026-10-08 08:00 UTC','Fixture cache time: 2026-10-08 08:00 UTC'):c.t('无网络请求；不是实时服务器状态。','No network request; not live server status.')}</small></div>`,c=>{if(c.key==='offline'&&c.op==='change')c.redraw()});
add('access',16,['RTL 使用方向属性，但代码和数值保持自己的方向','Use dir for RTL while code and numbers retain their own direction'],c=>`${check(c.t('从右向左排版','Right-to-left layout'),'rtl',!!c.s.rtl)}<section class="case-panel" dir="${c.s.rtl?'rtl':'ltr'}"><h4>${c.s.rtl?'مساحة العمل':c.t('工作区','Workspace')}</h4><div class="st-row"><span>${c.s.rtl?'الملف':c.t('文件','File')}</span><bdi dir="ltr">README.md</bdi><bdi dir="ltr">12 / 34</bdi></div><p>${c.s.rtl?'مراجعة التصميم':c.t('设计评审','Design review')}</p></section>`,c=>{if(c.key==='rtl'&&c.op==='change')c.redraw()});

// AI examples are deterministic local fixtures. No models, shell processes, credentials, or network calls.
add('ai',1,['聊天记录分角色显示，发送后追加本地固定回复','Show message roles and append a deterministic local reply'],c=>{c.s.messages??=[{role:'assistant',text:c.t('这是离线聊天界面示例。','This is an offline chat specimen.')}];return `<div class="case-chat" role="log" aria-live="polite">${c.s.messages.map(m=>`<article class="${m.role}"><strong>${m.role==='user'?c.t('你','You'):c.t('演示助手','Demo assistant')}</strong><p>${E(m.text)}</p></article>`).join('')}</div>${field(c.t('消息','Message'),'message',c.s.message||'','textarea')}${button(c.t('发送到本地示例','Send locally'),'send')}`},c=>{if(c.op==='send'){const v=(c.s.message||'').trim();if(!v)return c.out(c.t('请输入消息。','Enter a message.'),true);c.s.messages.push({role:'user',text:v},{role:'assistant',text:c.t('已在本地记录这条消息；没有调用模型。','Message recorded locally; no model was called.')});c.s.message='';c.$('[data-field="message"]').value='';c.redraw()}});
add('ai',2,['流式文字可停止，输出来源明确标记为固定文本','Stop streamed fixture text and label its deterministic source'],c=>`<div class="st-row">${button(c.t('播放固定文本','Stream fixture'),'start')}${button(c.t('停止','Stop'),'stop')}</div><p class="case-stream-output" aria-live="polite">${E(c.s.text||'')}</p><small>${c.t('演示分段显示预置文字，不是模型输出。','Streams predefined text chunks; not model output.')}</small>`,c=>{if(c.op==='stop'){clearInterval(c.s.timer);c.s.timer=null;c.out(c.t('已停止，已显示内容保留。','Stopped; visible output retained.'))}if(c.op==='start'){clearInterval(c.s.timer);const chunks=c.t('正在准备输入。\n正在组装预置结果。\n演示结束：没有调用模型。','Preparing inputs.\nAssembling the predefined result.\nDemo complete: no model call.').split('');let i=0;c.s.text='';c.s.timer=setInterval(()=>{if(!c.el.isConnected){clearInterval(c.s.timer);return}c.s.text+=chunks.slice(i,i+3).join('');i+=3;c.$('.case-stream-output').textContent=c.s.text;if(i>=chunks.length){clearInterval(c.s.timer);c.s.timer=null;c.out(c.t('固定文本播放结束。','Fixture streaming complete.'))}},55)}});
add('ai',3,['工具卡片展开输入与输出，不把预览当执行','Expand tool inputs and output without claiming execution'],c=>`<details class="case-disclosure"><summary><span class="st-pill">${c.t('未执行','Not executed')}</span> inspect_manifest</summary><div>${code(JSON.stringify({tool:'inspect_manifest',arguments:{path:'MANIFEST.json'},mode:'preview'},null,2))}<p>${c.t('输入输出只是合成示例，不读取真实项目文件。','Inputs and output are synthetic; no real project file is read.')}</p>${button(c.t('查看样例输出','Show fixture output'),'output')}</div></details><div class="case-tool-output"></div>`,c=>{if(c.op==='output')c.$('.case-tool-output').innerHTML=code(JSON.stringify({fixture:true,entries:3,status:'preview-only'},null,2))});
add('ai',4,['来源编号能打开对应片段，并标明合成来源','Open the cited excerpt and label it as synthetic'],c=>`<blockquote>${c.t('组件必须保留清楚的焦点反馈。','Components must preserve a clear focus indicator.')} <button class="case-citation" data-case-op="cite" aria-label="${c.t('查看合成来源 1','View synthetic source 1')}">[1]</button></blockquote><small>${c.t('这是引用界面示例，不以合成文本冒充真实外部文献。','A citation UI specimen; synthetic text is not presented as external literature.')}</small>`,c=>{if(c.op==='cite')U.popover(c.button,c.t('合成来源 1 · 设计备忘','Synthetic source 1 · design memo'),'<p>Fixture document · section 2</p><blockquote>'+c.t('无常驻边框不等于无键盘焦点。','No persistent border does not mean no keyboard focus.')+'</blockquote>')});
add('ai',5,['模型选项展示能力差异和未连接状态','Model choices expose capability differences and disconnected status'],c=>`${U.select(c.t('样例模型配置','Fixture model configuration'),'model',c.s.model||'local-text',[['local-text',c.t('文本演示配置','Text demo profile')],['local-image',c.t('图像演示配置','Image demo profile')],['unavailable',c.t('未连接配置','Disconnected profile')]])}<div class="case-model-capabilities">${c.s.model==='unavailable'?c.t('当前配置不可调用。','This profile is not callable.'):c.s.model==='local-image'?c.t('样例能力：文本 + 图片输入；没有真实后端。','Fixture capabilities: text + image inputs; no backend.'):c.t('样例能力：文本输入；没有真实后端。','Fixture capabilities: text input; no backend.')}</div>`,c=>{if(c.op==='select'&&c.key==='model')c.redraw()});
add('ai',6,['变量插值预览保留原始提示词，不调用模型','Preview variable interpolation without changing the prompt or calling a model'],c=>`${field(c.t('提示词模板','Prompt template'),'prompt',c.s.prompt??'Review {{project}} with a focus on {{topic}}.','textarea')}${field(c.t('项目','Project'),'project',c.s.project??'Design Atlas')}${field(c.t('主题','Topic'),'topic',c.s.topic??'keyboard accessibility')}${button(c.t('预览插值','Preview interpolation'),'preview')}<pre class="case-code case-prompt-output"></pre>`,c=>{if(c.op==='preview'){const t=(c.s.prompt||'').replace(/\{\{(project|topic)\}\}/g,(_,k)=>c.s[k]||'');c.$('.case-prompt-output').textContent=t;c.out(c.t('仅替换已知变量；未知变量保留。','Known variables substituted; unknown variables retained.'))}});
add('ai',7,['附件明确显示本地文件名和字节，不虚构 token 数','Show local attachment names and bytes without inventing token counts'],c=>`<label class="st-field"><span>${c.t('加入上下文文件','Add context files')}</span><input type="file" data-field="attachments" multiple></label><div class="case-context-files">${(c.s.files||[]).map(f=>`<div class="case-panel">${E(f.name)} · ${f.bytes} bytes</div>`).join('')}</div><small>${c.t('文件不上传；未读取内容，不提供 token 估算。','Files are not uploaded; contents are not read and no token estimate is provided.')}</small>`,c=>{if(c.key==='attachments'&&c.op==='change'){c.s.files=[...c.event.target.files].map(f=>({name:f.name,bytes:f.size}));c.$('.case-context-files').innerHTML=c.s.files.map(f=>`<div class="case-panel">${E(f.name)} · ${f.bytes} bytes</div>`).join('')}});
add('ai',8,['显示任务阶段，不制造内部思考过程','Show task stages without fabricating internal reasoning'],c=>`<ol class="case-step-list">${[c.t('准备输入','Prepare inputs'),c.t('检查格式','Check format'),c.t('生成样例结果','Assemble fixture')].map((x,i)=>`<li ${i===(c.s.step||0)?'aria-current="step"':''}><strong>${x}</strong><span>${i<(c.s.step||0)?c.t('完成','Complete'):i===(c.s.step||0)?c.t('当前阶段','Current stage'):c.t('未开始','Pending')}</span></li>`).join('')}</ol>${button(c.t('推进样例阶段','Advance fixture stage'),'next')}<small>${c.t('仅为可见任务状态，不呈现模型内部推理。','Visible task status only, not internal model reasoning.')}</small>`,c=>{if(c.op==='next'){c.s.step=((c.s.step||0)+1)%3;c.redraw()}});
add('ai',9,['先展示变更和影响，批准后仅更新本地草案','Preview scope and changes before updating a local draft'],c=>`<dl class="case-dl"><dt>${c.t('动作','Action')}</dt><dd>${c.t('将本地草案密度改为宽松','Set local draft density to comfortable')}</dd><dt>${c.t('影响范围','Scope')}</dt><dd>${c.t('仅这个案例','This case only')}</dd><dt>${c.t('当前值','Current value')}</dt><dd>${c.s.density||'compact'}</dd></dl><div class="st-row">${button(c.t('批准本地变更','Approve local change'),'approve')}${button(c.t('拒绝','Reject'),'reject')}</div>`,c=>{if(c.op==='approve'){c.s.density='comfortable';c.redraw();c.out(c.t('本地草案已更新；没有外部执行。','Local draft updated; no external execution.'))}if(c.op==='reject')c.out(c.t('已拒绝，草案保持不变。','Rejected; draft unchanged.'))});
add('ai',10,['日志记录实际点击步骤，并可按级别过滤','Record actual local actions and filter log severity'],c=>{c.s.events??=[];return `<div class="st-row">${button(c.t('记录一次检查','Record check'),'check')}${button(c.t('记录警告','Record warning'),'warn')}${button(c.t('清空日志','Clear log'),'clear')}</div>${U.select(c.t('日志级别','Log level'),'severity',c.s.severity||'all',[['all',c.t('全部','All')],['INFO','INFO'],['WARN','WARN']])}<pre class="case-code case-execution-log">${E(c.s.events.filter(e=>!c.s.severity||c.s.severity==='all'||e.level===c.s.severity).map(e=>`${e.seq} [${e.level}] ${e.text}`).join('\n'))}</pre>`},c=>{if(['check','warn','clear'].includes(c.op)){if(c.op==='clear')c.s.events=[];else c.s.events.push({seq:c.s.events.length+1,level:c.op==='warn'?'WARN':'INFO',text:c.op==='warn'?'User requested a fixture warning':'Local check button activated'});c.redraw()}if(c.op==='select')c.redraw()});
add('ai',11,['运行轨迹展开每一步的输入输出与耗时标签','Expand a fixture run trace with inputs, outputs, and labeled sample timing'],c=>`<div class="st-stack">${[['Input','text: hello','accepted: true','2 ms'],['Format','accepted: true','{"message":"hello"}','3 ms'],['Review','message: hello','awaiting approval','—']].map((a,i)=>`<details class="case-disclosure"><summary>${i+1}. ${a[0]} <span class="st-pill">${a[3]}</span></summary><div>${code('input → '+a[1]+'\noutput → '+a[2])}</div></details>`).join('')}</div><small>${c.t('耗时为固定测试数据，不是实测性能。','Timing is fixed fixture data, not measured performance.')}</small>`,null,{level:'native-interaction'});
add('ai',12,['差异能应用到本地文本，也能恢复原文','Apply a diff to local text and restore the original'],c=>`<div class="case-diff-lines"><div class="removed">− gap: 0px;</div><div class="added">+ gap: 21px;</div></div><div class="st-row">${button(c.t('应用到本地示例','Apply locally'),'apply')}${button(c.t('恢复原文','Restore original'),'restore')}</div>${code(c.s.applied?'gap: 21px;':'gap: 0px;')}`,c=>{if(['apply','restore'].includes(c.op)){c.s.applied=c.op==='apply';c.redraw()}});
add('ai',13,['终端只执行列明的本地演示命令，不访问系统','Terminal accepts allowlisted demo commands only, never the system shell'],c=>{c.s.lines??=['Demo terminal · help / ls / cat README / clear'];return `<pre class="case-code case-terminal-output" role="log">${E(c.s.lines.join('\n'))}</pre>${field(c.t('演示命令','Demo command'),'command',c.s.command||'','text','autocomplete="off" spellcheck="false"')}${button(c.t('执行本地命令','Run demo command'),'run')}<small>${c.t('不支持脚本、管道、网络、文件系统或任意代码执行。','No scripts, pipes, network, filesystem, or arbitrary code execution.')}</small>`},c=>{if(c.op==='run'){const cmd=(c.s.command||'').trim();c.s.lines.push('$ '+cmd);if(cmd==='clear')c.s.lines=[];else if(cmd==='help')c.s.lines.push('help | ls | cat README | clear');else if(cmd==='ls')c.s.lines.push('README.md   fixture.json   flow.json');else if(cmd==='cat README')c.s.lines.push('This is a local terminal UI specimen.');else c.s.lines.push('Unsupported demo command. No process was started.');c.s.command='';c.$('[data-field="command"]').value='';c.redraw()}},{mount:c=>c.$('[data-field="command"]').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();c.$('[data-case-op="run"]').click()}}});
function arithmetic(text){if(text.length>180||/[^\d\s.+\-*/()]/.test(text))throw Error('Only numbers, + − * / and parentheses are supported.');const tokens=text.match(/\d*\.?\d+|[+\-*/()]/g)||[];let i=0;function primary(){const t=tokens[i++];if(t==='('){const n=expr();if(tokens[i++]!==')')throw Error('Missing closing parenthesis.');return n}if(t==='-')return-primary();if(t==='+')return primary();const n=Number(t);if(!Number.isFinite(n))throw Error('Expected a number.');return n}function mul(){let n=primary();while(['*','/'].includes(tokens[i])){const op=tokens[i++],v=primary();if(op==='/'&&v===0)throw Error('Division by zero.');n=op==='*'?n*v:n/v}return n}function expr(){let n=mul();while(['+','-'].includes(tokens[i])){const op=tokens[i++],v=mul();n=op==='+'?n+v:n-v}return n}if(!tokens.length)throw Error('Enter an expression.');const n=expr();if(i!==tokens.length||!Number.isFinite(n))throw Error('Invalid expression.');return n}
add('ai',14,['代码单元演示受限算术解释器，不使用 eval','A code-cell specimen uses a restricted arithmetic parser, not eval'],c=>`${field(c.t('算术表达式','Arithmetic expression'),'expression',c.s.expression??'(12 + 8) * 3','textarea','spellcheck="false"')}${button(c.t('计算表达式','Evaluate expression'),'run')}<pre class="case-code case-cell-output">${E(c.s.output??'')}</pre><small>${c.t('只接受数字、四则运算和括号；不是 JavaScript / Python 执行器。','Accepts numbers, arithmetic operators and parentheses only; not a JavaScript or Python runtime.')}</small>`,c=>{if(c.op==='run'){try{c.s.output=String(arithmetic(c.s.expression||''));c.$('.case-cell-output').textContent=c.s.output;c.out(c.t('受限解释器计算完成。','Restricted parser completed.'))}catch(e){c.out(e.message,true)}}});
add('ai',15,['测试报告基于本地样例断言重算，不伪造工程 PASS','Recompute fixture assertions rather than inventing project test results'],c=>{const gap=c.s.gap===undefined?21:Math.max(0,Math.min(55,+c.s.gap||0));return `${field(c.t('样例间距（px）','Fixture gap (px)'),'gap',gap,'number','min="0" max="55"')}<div class="case-report-target" style="display:flex;gap:${gap}px"><span>A</span><span>B</span></div>${button(c.t('测量这个样例','Measure this specimen'),'test')}<pre class="case-code case-test-output">${E(c.s.report||c.t('尚未执行','Not run'))}</pre><small>${c.t('仅测试本案例 DOM，不代表完整项目或生产验收。','Tests this specimen DOM only, not a project or production sign-off.')}</small>`},c=>{if(c.key==='gap'&&c.op==='input')c.$('.case-report-target').style.gap=Math.max(0,+c.value||0)+'px';if(c.op==='test'){const a=c.$('.case-report-target span:first-child').getBoundingClientRect(),b=c.$('.case-report-target span:last-child').getBoundingClientRect(),gap=+(b.left-a.right).toFixed(2);c.s.report=(gap>=13?'PASS':'FAIL')+' · measured gap '+gap+'px · expected ≥13px';c.$('.case-test-output').textContent=c.s.report}});

tabItems=function(id){if(!M.node(state,id))return [r3LayoutMenu()];const at=state.tabs.indexOf(id);return [{label:r3T('关闭标签页','Close tab'),icon:'close',run:()=>r3CloseSubset('one',id)},{label:r3T('关闭其他标签页','Close other tabs'),run:()=>r3CloseSubset('others',id)},{label:r3T('关闭前面的标签页','Close preceding tabs'),disabled:at<=0,run:()=>r3CloseSubset('before',id)},{label:r3T('关闭后面的标签页','Close following tabs'),disabled:at>=state.tabs.length-1,run:()=>r3CloseSubset('after',id)},{label:r3T('关闭全部标签页','Close all tabs'),run:()=>r3CloseSubset('all',id)},sep,{label:r3T('向前移动标签','Move tab earlier'),disabled:at<=0,run:()=>r3Reorder(id,at-1)},{label:r3T('向后移动标签','Move tab later'),disabled:at>=state.tabs.length-1,run:()=>r3Reorder(id,at+1)},r3LayoutMenu(),sep,...r3BaseTabItems(id).slice(-1)]};
function openR3Studio(){rememberView();surface='styles';activity='styles';previewState='';renderTabs();renderMain();updateActivity();renderStatus();r3SyncStudioButton()}
function renderR3Studio(){const content=$('#main-content');content.dataset.fileId='';$('#breadcrumb').textContent=r3T('设计工作室 / 风格与版式','Design Studio / Styles and layouts');$('#view-tools').innerHTML='';studioActive=StudioR2.mountGallery(content,{locale:state.config.locale});$('#save-state').textContent=r3T('独立样例预览 · 不恢复或修改用户文件','Independent sample previews · user files unchanged');$('#main-meta').textContent='18 + 6';r3SyncStudioButton()}
function r3SyncStudioButton(){const b=$('[data-r2-open]');if(b)b.setAttribute('aria-pressed',String(surface==='styles'||!!$('#main-content .studio-r2')))}
function r3OpenCase(id){if(!CaseRegistry.definitions.has(id))return false;Workbench.openAtlas();WBAtlas.resetFilters();const input=$('#atlas-search');input.value=id;input.dispatchEvent(new Event('input',{bubbles:true}));const row=$('[data-case-row="'+CSS.escape(id)+'"]');row?.scrollIntoView({block:'start'});return true}
function r3Route(){let h;try{h=decodeURIComponent(location.hash.slice(1))}catch{return;}if(h.startsWith('case='))r3OpenCase(h.slice(5));else if(h.startsWith('file=')){const id=h.slice(5);if(M.node(state,id))openFile(id)}else if(h==='studio')openR3Studio();else if(h==='tabs'){$('[data-action=tabs-menu]')?.focus();}else if(h==='atlas')Workbench.openAtlas();}
function r3Init(){r3EnsureTabDOM();r3SyncStudioButton();window.addEventListener('hashchange',r3Route);r3Route();globalThis.WorkbenchR3=Object.freeze({version:'v0.5-r3',openStyles:openR3Studio,openCase:r3OpenCase,tabPosition:r3TabPosition,reorderTab:r3Reorder,setTabPosition(value){if(!['top','bottom','left','right'].includes(value))throw Error('Invalid tab position');state.config.tabPosition=value;renderTabs();scheduleViewPersist()},pageTabs:r3PageTabs,closeTabs:r3CloseSubset});}

function initialize(){StudioR2.augmentWorkspace(state);WBSelect.configure({host:overlayHost,beforeOpen:()=>{hideMenus();hideTip();}});if(!$('#app'))document.body.insertAdjacentHTML('afterbegin',scaffold());shell();render();WBI18n.setLanguage(state.config.locale);WBI18n.observe();
document.addEventListener('click',e=>{if(suppressDragClick){suppressDragClick=false;return;}const command=e.target.closest('[data-command]');if(command)return executePalette(+command.dataset.command);const b=e.target.closest('[data-action]');if(b&&!b.disabled){dispatch(b,e);return;}const row=e.target.closest('[data-node]');if(row){const id=row.dataset.node;if(!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&M.node(state,id)?.type!=='folder')openFile(id);else selectNode(id,e);}});
document.addEventListener('dblclick',e=>{const row=e.target.closest('[data-node]');if(row&&M.node(state,row.dataset.node)?.type==='folder')toggleFolder(row.dataset.node);const graph=e.target.closest('[data-graph]');if(graph)graphDialog(graph.dataset.graph);const tr=e.target.closest('[data-row]');if(tr)rowDialog(data().rows.find(r=>r.id===tr.dataset.row));});
document.addEventListener('contextmenu',e=>{if(e.target.closest('input,textarea,[contenteditable="true"]'))return;const ctx=previewContext(e);if(ctx){e.preventDefault();openMenu(ctx.items,e.clientX,e.clientY,ctx.el);}});
// Escape dismisses only the uppermost tooltip; a second Escape can close its parent dialog.
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#tooltip').hidden){hideTip();e.preventDefault();e.stopImmediatePropagation();}},true);
document.addEventListener('compositionstart',e=>{if(e.target.id==='tree-search')queueTreeFilter.cancel();});document.addEventListener('input',handleInput);document.addEventListener('change',e=>{if(e.target.closest('.settings-modal'))refreshSettingsDirty();});document.addEventListener('compositionend',e=>{if(e.target.id==='list-search'){listQuery=e.target.value;paintTableRows();}else if(e.target.id==='tree-search'){query=e.target.value;queueTreeFilter();}else if(e.target.id==='command-input'){paletteIndex=0;filterPalette();}});document.addEventListener('keydown',trapDialog);document.addEventListener('keydown',onKey);
document.addEventListener('pointerdown',e=>{if(menus.length&&!e.target.closest('.menu')&&e.button===0){hideMenus(true);suppressOutsideClick=true;e.preventDefault();}hideTip();},true);document.addEventListener('click',e=>{if(suppressOutsideClick){suppressOutsideClick=false;e.preventDefault();e.stopImmediatePropagation();}},true);document.addEventListener('pointerup',()=>setTimeout(()=>suppressOutsideClick=false,0),true);document.addEventListener('pointerover',e=>{const b=e.target.closest('[data-tip]');if(b&&!b.contains(e.relatedTarget))requestTip(b);});document.addEventListener('pointerout',e=>{const b=e.target.closest('[data-tip]');if(b&&!b.contains(e.relatedTarget))deferHideTip();});document.addEventListener('focusin',e=>requestTip(e.target.closest('[data-tip]')));document.addEventListener('focusout',()=>deferHideTip());$('#tooltip').addEventListener('pointerenter',()=>clearTimeout(tooltipCloseTimer));$('#tooltip').addEventListener('pointerleave',deferHideTip);
document.addEventListener('keydown',e=>{if(e.target.id==='property-name'){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();commitProperty(e.target);}else if(e.key==='Escape'){propertyDrafts.delete(e.target.dataset.id);e.target.value=M.node(state,e.target.dataset.id).name;e.target.removeAttribute('aria-invalid');$('#property-error').hidden=true;$('[data-action="apply-name"]').disabled=true;}}});
document.addEventListener('submit',e=>{if(e.target.id!=='modal-form')return;e.preventDefault();if(!$('#modal').open||modalBusy||!modalSubmit)return;modalBusy=true;try{const ok=modalSubmit(e.target);if(ok!==false)closeDialog();}catch(err){$('#dialog-error').textContent=err.message;$('#dialog-error').hidden=false;}finally{modalBusy=false;}});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeDialog();});$('#palette').addEventListener('cancel',e=>{e.preventDefault();closePalette();});$('#drawer').addEventListener('cancel',e=>{e.preventDefault();closeDrawer();});
for(const id of ['modal','palette','drawer'])$('#'+id).addEventListener('click',e=>{if(e.target!==e.currentTarget)return;const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){if(id==='modal')closeDialog();else if(id==='palette')closePalette();else closeDrawer();}});
$('#import-file').addEventListener('change',e=>{importFile(e.target.files[0]);e.target.value='';});installResize($('#split-left'),'left');installResize($('#split-right'),'right');installDnD();installCanvasDragging();
const reflow=frameTask(()=>{hideMenus(true);hideTip();if(drawerView&&(currentMode()==='wide'||currentMode()==='medium'&&physicalSide(drawerView)==='left'))closeDrawer();applyLayout();positionToast();});window.addEventListener('resize',()=>reflow());
window.addEventListener('storage',e=>{if(e.key===KEY){clearTimeout(persistTimer);persistTimer=null;persistPending=false;storageLocked=true;storageProblem='其他窗口已更新 · 请先导出当前副本';status(storageProblem,true);notify(storageProblem,'error');}});
window.addEventListener('pagehide',()=>{if(persistPending)persist();});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&persistPending)persist();});
if(storageProblem)notify(storageProblem+'；可先导出当前副本再导入恢复。','error');
globalThis.Workbench=Object.freeze({version:'v0.5-r3',storageKey:KEY,openSample:id=>openFile(id),openAtlas:()=>{surface='components';activity='components';render();},snapshot:()=>M.clone(state),diagnostics:()=>({...runtimeStats,persistPending,activity,overlays:$$('.menu,.select-popup').length})});
}
initialize();
if(StudioR2.migration.changed&&!storageLocked)scheduleViewPersist();
const r2Rail=document.querySelector('.activity-rail');
if(r2Rail&&!r2Rail.querySelector('[data-r2-open]')){
 const slot=r2Rail.querySelector('[data-action=components]');const node=document.createElement('span');
 node.innerHTML=StudioUI.icon('image',state.config.locale==='en'?'Styles and layouts':'风格与版式','data-r2-open aria-pressed="false"');
 const button=node.firstElementChild;button.classList.add('icon-button');
 (slot||r2Rail.lastElementChild).before(button);
 button.onclick=()=>openR3Studio();
 const observeRoot=document.getElementById('main-content');const sync=()=>button.setAttribute('aria-pressed',String(!!observeRoot.querySelector('.studio-r2')));
 new MutationObserver(sync).observe(observeRoot,{childList:true});sync();
 const label=()=>{const text=document.documentElement.lang==='en'?'Styles and layouts':'风格与版式';if(button.getAttribute('aria-label')!==text)button.setAttribute('aria-label',text);if(button.dataset.stTip!==text)button.dataset.stTip=text};
 new MutationObserver(label).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});label();
}
if(location.hash==='#studio')openR3Studio();
r3Init();
if(location.hash==='#canvas')openFile('sample-canvas');else if(location.hash==='#atlas'){surface='components';activity='components';render();}
})();
</script></body></html>
